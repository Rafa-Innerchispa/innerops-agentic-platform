name: P0 Coordination Contract

on:
  pull_request:
    paths:
      - "platform/inneros_core_runtime/coordination_*.py"
      - "platform/inneros_core_runtime/durable_coordination_spine.py"
      - "platform/tests/test_coordination_recovery_p0.py"
      - "scripts/audit_p0_mcp_small_public_oauth.py"
      - ".github/workflows/p0-coordination.yml"
  push:
    branches: [main]
    paths:
      - "platform/inneros_core_runtime/coordination_*.py"
      - "platform/inneros_core_runtime/durable_coordination_spine.py"
      - "platform/tests/test_coordination_recovery_p0.py"
      - "scripts/audit_p0_mcp_small_public_oauth.py"
      - ".github/workflows/p0-coordination.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies
        run: python -m pip install python-dotenv pymongo temporalio nats-py
      - name: Compile critical Python
        run: |
          python -m py_compile \
            platform/inneros_core_runtime/coordination_live.py \
            platform/inneros_core_runtime/coordination_ingest.py \
            platform/tests/test_coordination_recovery_p0.py \
            scripts/audit_p0_mcp_small_public_oauth.py
      - name: Run P0 coordination contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: platform
        run: python platform/tests/test_coordination_recovery_p0.py -v
      - name: Check whitespace errors
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            git diff --check "${{ github.event.before }}...${{ github.sha }}"
          fi
