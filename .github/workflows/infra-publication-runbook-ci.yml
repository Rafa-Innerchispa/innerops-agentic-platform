name: Infra Publication Runbook CI
on:
  push:
    branches:
      - chatgpt/infralens-publication-runbook-20260930
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate recovery script syntax
        run: bash -n scripts/deploy_infralens_publication_recovery.sh
      - name: Verify fail-closed invariants
        run: |
          grep -F 'OCR_HEALTH="http://127.0.0.1:18765/health"' scripts/deploy_infralens_publication_recovery.sh
          grep -F 'EXPECTED_IMAGE="sha256:dbfcaf89fc2d47823406c1ceeefef464a98a7e4328226511ab1625c3d721868f"' scripts/deploy_infralens_publication_recovery.sh
          grep -F 'cloudflare_tunnel_ingress_upsert' scripts/deploy_infralens_publication_recovery.sh
          grep -F 'restore_runtime' scripts/deploy_infralens_publication_recovery.sh
