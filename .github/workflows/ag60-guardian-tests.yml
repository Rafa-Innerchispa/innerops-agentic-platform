name: AG-60 Protocol Guardian Tests
on:
  pull_request:
    paths:
      - 'platform/inneros_core_runtime/protocol_catalog.py'
      - 'platform/inneros_core_runtime/communication_observer.py'
      - 'platform/inneros_core_runtime/network_guardian.py'
      - 'platform/inneros_core_runtime/unifi_readonly.py'
      - 'platform/inneros_core_runtime/physical_bus_observer.py'
      - 'platform/inneros_core_runtime/communication_history.py'
      - 'platform/inneros_core_runtime/communication_runner.py'
      - 'platform/inneros_core_runtime/device_fabric.py'
      - 'platform/inneros_core_runtime/capability_gateway.py'
      - 'platform/tests/test_ag60_*.py'
      - '.github/workflows/ag60-guardian-tests.yml'
  push:
    branches:
      - 'fix/ag60-home-truth-20261009'
  workflow_dispatch:

jobs:
  ag60-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install pytest httpx websockets python-dotenv
      - name: Compile changed modules
        run: |
          python -m py_compile platform/inneros_core_runtime/protocol_catalog.py platform/inneros_core_runtime/communication_observer.py platform/inneros_core_runtime/network_guardian.py platform/inneros_core_runtime/device_fabric.py platform/inneros_core_runtime/capability_gateway.py platform/inneros_core_runtime/unifi_readonly.py platform/inneros_core_runtime/physical_bus_observer.py platform/inneros_core_runtime/communication_history.py platform/inneros_core_runtime/communication_runner.py
      - name: Run AG-60 unit tests (offline, mocked)
        run: |
          set -eu
          # The repository directory named platform shadows Python's stdlib
          # platform module when pytest starts from the checkout root.
          # Keep source imports and __file__-relative tests in an isolated
          # mirror, as already done by inneros-runtime-gates.yml.
          TEST_ROOT="$RUNNER_TEMP/inneros-ag60-isolated"
          mkdir -p "$TEST_ROOT/platform/tests"
          cp platform/tests/test_ag60_*.py platform/tests/conftest.py "$TEST_ROOT/platform/tests/"
          for entry in "$GITHUB_WORKSPACE"/platform/*; do
            base=$(basename "$entry")
            [ "$base" = "tests" ] || ln -s "$entry" "$TEST_ROOT/platform/$base"
          done
          cd "$TEST_ROOT/platform/tests"
          PYTHONPATH="$GITHUB_WORKSPACE/platform" python -m pytest -q test_ag60_*.py
