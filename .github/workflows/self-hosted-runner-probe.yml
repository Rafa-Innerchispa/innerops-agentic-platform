name: Self-hosted Runner Probe

on:
  push:
    branches:
      - chatgpt/self-hosted-runner-probe-20261008
    paths:
      - ".github/workflows/self-hosted-runner-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Probe runner identity only
        shell: bash
        run: |
          set -eu
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "runner_os=${RUNNER_OS:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          hostname
          uname -srm
          pwd
