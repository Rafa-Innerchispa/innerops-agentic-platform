name: Apply Dev Swarm path guidance fix

on:
  push:
    branches:
      - chatgpt/devswarm-path-guidance-20260915

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/devswarm-path-guidance-20260915
          fetch-depth: 0

      - name: Verify codemod is applicable
        run: python scripts/apply_devswarm_path_guidance_fix.py --check

      - name: Apply bounded scheduler patch
        run: python scripts/apply_devswarm_path_guidance_fix.py

      - name: Compile touched Python
        run: |
          python -m py_compile \
            platform/inneros_core_runtime/dev_swarm_scheduler.py \
            platform/inneros_core_runtime/dev_swarm_path_guidance.py \
            scripts/apply_devswarm_path_guidance_fix.py

      - name: Run focused unit tests
        env:
          PYTHONPATH: platform
        run: |
          python -m unittest platform/tests/test_dev_swarm_path_guidance.py
          python -m unittest platform/tests/test_apply_devswarm_path_guidance_fix.py

      - name: Validate diff
        run: git diff --check

      - name: Commit validated scheduler patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-devswarm-path-guidance.yml
          git config user.name "RalfIA Dev Swarm"
          git config user.email "dev-swarm@inneros.local"
          git add platform/inneros_core_runtime/dev_swarm_scheduler.py
          git add -u .github/workflows/apply-devswarm-path-guidance.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix Dev Swarm repo-policy path validation"
          git push origin HEAD:chatgpt/devswarm-path-guidance-20260915
