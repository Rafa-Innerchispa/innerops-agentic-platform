name: InnerOS P0 Runtime Safety Gates

on:
  pull_request:
    # Required status checks must run on EVERY PR, including docs-only changes.
  workflow_dispatch:
  push:
    # Test the EXACT merged main SHA even when changed files were not on a list.
    # Path filters previously skipped Cursor headless and Temporal recovery merges.
    branches: [main]

permissions:
  contents: read

jobs:
  critical-runtime-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated runtime test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r platform/requirements.txt pytest mongomock
      - name: Compile critical runtime contracts
        run: |
          python -m compileall -q \
            platform/inneros_core_runtime/local_model_router.py \
            platform/raphiia_openai/__init__.py \
            platform/tests/test_local_model_router_fallback.py \
            scripts/inneros_branch_ledger.py \
            platform/tests/test_inneros_branch_ledger.py \
            platform/inneros_core_runtime/execution_binding.py \
            platform/inneros_core_runtime/cursor_execution_plane.py \
            platform/inneros_core_runtime/capability_gateway.py \
            platform/inneros_core_runtime/capability_gateway_peer.py \
            scripts/inneros_local_release_executor.py \
            scripts/inneros_release_gate.py \
            platform/tests/test_inneros_release_gate.py \
            platform/inneros_core_runtime/local_execution_plane.py \
            platform/tests/test_gitlab_runner_policy_precedence.py \
            platform/inneros_core_runtime/local_github_plane.py \
            platform/tests/test_local_github_plane.py \
            platform/scripts/repo_delivery_guardian.py \
            platform/tests/test_repo_delivery_guardian.py \
            platform/tests/test_capability_gateway_regressions_p0.py \
            platform/inneros_core_runtime/governed_model_writes.py \
            platform/inneros_core_runtime/temporal_bounded_executor.py \
            platform/inneros_core_runtime/interactive_ops_runner.py \
            platform/inneros_core_runtime/ops_global_completion_gate.py \
            platform/inneros_core_runtime/ops_lifecycle.py \
            platform/scripts/cursor_ha_e2e_server_probe.py \
            platform/tests/test_governed_model_writes.py \
            platform/inneros_core_runtime/execution_receipts.py \
            platform/scripts/cursor_ops_headless_execute_one.py \
            platform/scripts/antigravity_ops_headless_execute_one.py \
            platform/inneros_core_runtime/antigravity_headless_dispatch.py \
            platform/tests/test_ops_antigravity_false_completion_regression.py \
            platform/tests/test_execution_receipts.py \
            platform/scripts/reconcile_ops_mongo_temporal.py \
            platform/tests/test_reconcile_ops_mongo_temporal.py \
            platform/inneros_core_runtime/coordination_liveness.py \
            platform/tests/test_coordination_liveness.py \
            platform/inneros_core_runtime/temporal_activities.py \
            platform/inneros_core_runtime/agents/pool_agent_runners.py \
            platform/tests/test_global_coordination_guards.py \
            platform/tests/test_peer_ops_runner_contract.py
      - name: Peer Ops and Temporal evidence regression suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -e
          # The top-level `platform/` package shadows the stdlib `platform`
          # module whenever pytest imports tests by package path, which broke
          # collection of this whole suite. Run the gate from a layout mirror
          # (real test files, symlinked siblings) so test modules import
          # top-level while __file__-relative reads keep resolving.
          # (Structural fix would be renaming `platform/`; owner decision.)
          GATE_LIST="
            platform/tests/test_execution_resource_guard.py
            platform/tests/test_execution_resource_audit.py
            platform/tests/test_global_coordination_guards.py
            platform/tests/test_execution_binding.py
            platform/tests/test_local_model_router_fallback.py
            platform/tests/test_inneros_branch_ledger.py
            platform/tests/test_execution_receipts.py
            platform/tests/test_reconcile_ops_mongo_temporal.py
            platform/tests/test_governed_model_writes.py
            platform/tests/test_capability_gateway.py
            platform/tests/test_capability_gateway_regressions_p0.py
            platform/tests/test_peer_ops_runner_contract.py
            platform/tests/test_peer_observability_security_p0.py
            platform/tests/test_local_release_executor_contract.py
            platform/tests/test_inneros_release_gate.py
            platform/tests/test_gitlab_runner_policy_precedence.py
            platform/tests/test_local_github_plane.py
            platform/tests/test_repo_delivery_guardian.py
            platform/tests/test_runtime_routing_and_a2a_lease_regressions.py
            platform/tests/test_a2a_bridge.py
            platform/tests/test_temporal_bounded_executor.py
            platform/tests/test_coordination_liveness.py
            platform/tests/test_anti_freeze_scheduler.py
            platform/tests/test_dev_swarm_silent_stall_regression.py
            platform/tests/test_integration_guardian_sha.py
            platform/tests/test_ops_auto_claim_admission.py
            platform/tests/test_ops_antigravity_false_completion_regression.py
            platform/tests/test_completion_gate_evidence_keys.py
            platform/tests/test_cursor_headless_retry_policy.py
            platform/tests/test_cursor_ops_runner.py
            platform/tests/test_cursor_execution_plane.py
            platform/tests/test_owner_authorization_pipeline.py
            platform/tests/test_main_ci_gate_trigger.py
            platform/tests/test_ops_task_requirements.py
            platform/tests/test_ops_task_requirements_e2e.py
            platform/tests/test_ops_owner_approval_ha.py
            platform/tests/test_provider_execution_trust_boundary.py
            platform/tests/test_ops_fmea_invariants.py
            platform/tests/test_dev_swarm_retry_budget_regression.py
            platform/tests/test_ops_global_completion_gate.py
            platform/tests/test_ops_deploy_scheduler_loop_regression.py
            platform/tests/test_ops_cancel_eviction.py
            platform/tests/test_ops_expired_lease_recovery.py
            platform/tests/test_ops_claim_spawn_ack.py
            platform/tests/test_ops_whatsapp_authorization_flow.py
            platform/tests/test_ops_interactive_claim_release.py
            platform/tests/test_ops_antigravity_claim_node_recovery.py
            platform/tests/test_ops_owner_authorization_notify.py
            platform/tests/test_ops_whatsapp_internal_fix.py
            platform/tests/test_ops_lifecycle_metrics.py
          "
          GATE_ROOT="$RUNNER_TEMP/inneros-gates/root"
          rm -rf "$RUNNER_TEMP/inneros-gates"
          mkdir -p "$GATE_ROOT/platform/tests"
          cp platform/tests/test_*.py platform/tests/conftest.py "$GATE_ROOT/platform/tests/"
          for entry in "$GITHUB_WORKSPACE"/platform/*; do
            base=$(basename "$entry")
            [ "$base" = "tests" ] || ln -s "$entry" "$GATE_ROOT/platform/$base"
          done
          for entry in scripts docs .github var; do
            [ -e "$GITHUB_WORKSPACE/$entry" ] && ln -s "$GITHUB_WORKSPACE/$entry" "$GATE_ROOT/$entry" || true
          done
          cd "$GATE_ROOT/platform/tests"
          PYTHONPATH="$GITHUB_WORKSPACE/platform" python -m pytest -q $(printf '%s\n' $GATE_LIST | xargs -n1 basename)
      - name: Produce CI-only provenance manifest
        env:
          INNEROS_COMMIT: ${{ github.sha }}
          INNEROS_RUN_ID: ${{ github.run_id }}
          INNEROS_EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          output = {
              "schema_version": "inneros-ci-candidate-v1",
              "git_sha": os.environ["INNEROS_COMMIT"],
              "github_run_id": os.environ["INNEROS_RUN_ID"],
              "event": os.environ["INNEROS_EVENT"],
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "status": "CI_ONLY",
              "production_deployed": False,
              "last_known_good_certified": False,
              "host_evidence_required": True,
              "note": "CI success must never be presented as a production release.",
          }
          folder = Path(".inneros-ci")
          folder.mkdir(exist_ok=True)
          (folder / "runtime_candidate.json").write_text(
              json.dumps(output, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Preserve candidate manifest
        uses: actions/upload-artifact@v4
        with:
          name: inneros-ci-candidate
          path: .inneros-ci/runtime_candidate.json
          retention-days: 30
