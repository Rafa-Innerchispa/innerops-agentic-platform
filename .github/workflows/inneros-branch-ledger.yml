name: InnerOS Branch and Production Ledger

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inneros-branch-ledger.yml"
      - "scripts/inneros_branch_ledger.py"
      - "platform/tests/test_inneros_branch_ledger.py"
      - "docs/INNEROS_RELEASE_ATTESTATION.json"
  schedule:
    # 12:00 UTC = 07:00 Ecuador, every day
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: inneros-canonical-branch-inventory
  cancel-in-progress: true

jobs:
  audit:
    if: github.repository == 'Rafa-Innerchispa/innerops-agentic-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch trusted main only
        uses: actions/checkout@v4
        with:
          # Upstream checkout issue: persist-credentials=false invokes
          # git submodule foreach even when submodules are disabled.
          # This repo has a legacy gitlink without a .gitmodules entry.
          # No untrusted PR code runs in this main-only workflow.
          persist-credentials: true
          submodules: false
          fetch-depth: 1
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s platform/tests -p 'test_inneros_branch_ledger.py' -v
      - name: Inventory every branch without changing main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: Rafa-Innerchispa/innerops-agentic-platform
        run: |
          python scripts/inneros_branch_ledger.py --repo "$GITHUB_REPOSITORY" --workers 4
          cp inneros-branch-ledger.md docs/INNEROS_BRANCH_LEDGER.md
      - name: Open or update a reviewable branch ledger PR
        id: ledger_pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/inneros-branch-ledger
          add-paths: docs/INNEROS_BRANCH_LEDGER.md
          delete-branch: false
          commit-message: "chore(inneros): refresh audited branch debt"
          title: "chore(inneros): review refreshed branch and production ledger"
          body: |
            Generated read-only inventory. No branch deletions, merges, or automatic deployment.
            HISTORIA_SEPARADA means a historical branch has no common ancestor with main.
            AMD/Intel host attestations must be verified independently before marking production.
            Review the diff and critical-runtime-contracts before merging. Do not enable auto-merge.
      - name: Explicit CI dispatch for GITHUB_TOKEN-created review PR
        if: steps.ledger_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run inneros-runtime-gates.yml --ref automation/inneros-branch-ledger
      - name: Preserve full JSON and Markdown snapshot even if publication failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inneros-branch-ledger
          path: |
            inneros-branch-ledger.md
            inneros-branch-ledger.json
          if-no-files-found: warn
          retention-days: 90
