name: muse-self-heal-metrics
on:
  push:
    paths:
      - 'platform/inneros_core_runtime/muse_experiment_metrics.py'
      - 'platform/tests/test_muse_experiment_metrics.py'
      - 'platform/inneros_core_runtime/muse_wonder_trial.py'
      - 'platform/tests/test_muse_wonder_trial.py'
      - '.github/workflows/muse-self-heal-metrics.yml'
  pull_request:
    paths:
      - 'platform/inneros_core_runtime/muse_experiment_metrics.py'
      - 'platform/tests/test_muse_experiment_metrics.py'
      - 'platform/inneros_core_runtime/muse_wonder_trial.py'
      - 'platform/tests/test_muse_wonder_trial.py'
      - '.github/workflows/muse-self-heal-metrics.yml'
permissions:
  contents: read
jobs:
  stdlib-offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run isolated measurement and provenance tests
        env:
          PYTHONPATH: platform
        run: python -m unittest discover -s platform/tests -p 'test_muse*.py' -v
